name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (black)
        run: python -m black --check .

      - name: Lint (flake8)
        run: python -m flake8 src tests run_pipeline.py notebooks/eda_labels.py

      - name: Type check (mypy)
        run: python -m mypy src

      - name: Test (pytest)
        run: python -m pytest -q

      - name: Guard no raw artifacts tracked
        run: |
          git ls-files | grep -E '^data/|^outputs/' && {
            echo "Tracked files under data/ or outputs/ are not allowed in CI."
            exit 1
          } || true

