[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geograph-lcm"
version = "0.1.0"
description = "Pipeline to build a Geograph image dataset labeled with UKCEH LCM classes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "tqdm>=4.66.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
geo = [
  "rasterio>=1.3.0",
  "geopandas>=0.14.0",
  "shapely>=2.0.0",
  "pyproj>=3.5.0",
]
dev = [
  "black>=24.0.0",
  "flake8>=7.0.0",
  "mypy>=1.8.0",
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
